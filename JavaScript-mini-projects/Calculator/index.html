<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">    
</head>

<body>
    <div class="dark-mode">
        <button id="dark-mode-toggle">Dark Mode</button>
    </div>

    <div class="calculator">
        <input type="text" class="display" value="" disabled />
        <div class="keys">
            <div class="general-keys">
                <button type="button" class="key-clear">C</button>
                <button type="button" class="key-divide">/</button>
                <button type="button" class="key-divide">%</button>
                <button type="button" class="key-backspace">←</button>
            </div>
            <div class="number-keys">
                <button type="button" class="key-7">7</button>
                <button type="button" class="key-8">8</button>
                <button type="button" class="key-9">9</button>
                <button type="button" class="key-multiply">*</button> </br>
                <button type="button" class="key-4">4</button>
                <button type="button" class="key-5">5</button>
                <button type="button" class="key-6">6</button>
                <button type="button" class="key-subtract">-</button> </br>
                <button type="button" class="key-1">1</button>
                <button type="button" class="key-2">2</button>
                <button type="button" class="key-3">3</button>
                <button type="button" class="key-add">+</button> </br>
                <button type="button" class="key-0">0</button>
                <button type="button" class="key-00">00</button>
                <button type="button" class="key-dot">.</button>
                <button type="button" class="key-equals">=</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
